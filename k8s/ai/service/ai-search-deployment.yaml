apiVersion: v1
kind: Service
metadata:
  name: ai-search-service
  namespace: ecommerce-dev
  labels:
    app.kubernetes.io/name: ai-search-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: ai-search-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-search-service
  namespace: ecommerce-dev
  labels:
    app.kubernetes.io/name: ai-search-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-search-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-search-service
    spec:
      containers:
        - name: ai-search-service
          image: ghcr.io/rakib1620/ai-search-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: QDRANT_HOST
              value: "qdrant.ecommerce-dev.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: COLLECTION_NAME
              value: "ecommerce-products"
            - name: EMBEDDING_MODEL
              value: "all-MiniLM-L6-v2"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 1024Mi
            requests:
              cpu: 250m
              memory: 512Mi

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-purpose
spec:
  template:
    metadata:
      labels:
        workload-type: general-microservices
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Workload Requirements
      requirements:
        # FinOps Strategy 1: Prioritize Spot Instances, Fallback to On-Demand
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        # FinOps Strategy 2: Support both x86 and AWS Graviton ARM64
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]

        # Supported Instance Families (Compute, General Purpose, Memory)
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r", "t"]

        # Modern generation instances only (Better price-to-performance)
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]

  # FinOps Strategy 3: Dynamic Consolidation & Bin-Packing
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "10%" # Maximum 10% nodes can be disrupted simultaneously

  # FinOps Strategy 4: Budget Guardrails (Bill-Shock Prevention)
  limits:
    cpu: 50
    memory: 200Gi

apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: postgres-network-delay
  namespace: ecommerce-dev
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - ecommerce-dev
    labelSelectors:
      app.kubernetes.io/name: postgres
  delay:
    latency: "200ms"
    jitter: "20ms"
  direction: to
  duration: "1m"
  scheduler:
    cron: "@every 15m"

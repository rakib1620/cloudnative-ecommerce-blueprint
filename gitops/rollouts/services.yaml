apiVersion: v1
kind: Service
metadata:
  name: order-service-stable
  namespace: ecommerce-dev
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: order-service
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-canary
  namespace: ecommerce-dev
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: order-service

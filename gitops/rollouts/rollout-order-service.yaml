apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-service-rollout
  namespace: ecommerce-dev
  labels:
    app.kubernetes.io/name: order-service
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/rakib1620/order-service:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
  strategy:
    canary:
      # Stable and Canary Service traffic splitting
      stableService: order-service-stable
      canaryService: order-service-canary
      trafficRouting:
        nginx:
          stableIngress: order-service-ingress
      steps:
        # Step 1: Send 20% traffic to Canary
        - setWeight: 20
        - pause: { duration: 1m }

        # Step 2: Automated Metric Analysis via Prometheus
        - analysis:
            templates:
              - templateName: http-success-rate-check

        # Step 3: Promote to 40%
        - setWeight: 40
        - pause: { duration: 1m }

        # Step 4: Promote to 60%
        - setWeight: 60
        - pause: { duration: 1m }

        # Step 5: Full 100% rollout to all users
        - setWeight: 100

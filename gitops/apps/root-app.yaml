apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-ecommerce-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rakib1620/cloudnative-ecommerce-blueprint.git
    targetRevision: HEAD
    path: gitops/apps/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

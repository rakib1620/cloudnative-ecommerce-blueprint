apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: ecommerce-kafka-cluster
  namespace: ecommerce
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    storage:
      type: persistent-claim
      size: 50Gi
      deleteClaim: false
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: false
---
# Declarative Kafka Topics
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: order-created
  namespace: ecommerce
  labels:
    strimzi.io/cluster: ecommerce-kafka-cluster
spec:
  partitions: 6
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: payment-completed
  namespace: ecommerce
  labels:
    strimzi.io/cluster: ecommerce-kafka-cluster
spec:
  partitions: 6
  replicas: 3

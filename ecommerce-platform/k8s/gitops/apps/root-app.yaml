apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-ecommerce-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ecommerce-platform/ecommerce-platform.git
    targetRevision: HEAD
    path: k8s/charts
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

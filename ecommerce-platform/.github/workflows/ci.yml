name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Commitlint PR Check
        if: github.event_name == 'pull_request'
        run: |
          npm ci
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  auth-service-ci:
    name: Auth Service (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test & Coverage
        working-directory: ./apps/auth-service
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  ai-search-service-ci:
    name: AI Search Service (Python FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies & Test
        working-directory: ./apps/ai-search-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest --cov=src --cov-fail-under=80

  security-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [auth-service-ci, ai-search-service-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

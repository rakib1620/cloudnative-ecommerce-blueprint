name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, develop, feat/*, feat/**]
  pull_request:
    branches: [main, develop]

jobs:
  auth-service-ci:
    name: Auth Service Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Unit Tests
        working-directory: ./apps/auth-service
        run: |
          go test -v ./...

  ai-search-service-ci:
    name: AI Search Service (80% Coverage Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Run Pytest
        working-directory: ./apps/ai-search-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest --cov=src --cov-fail-under=80

  trivy-security-scan:
    name: Trivy Vulnerability Security Scan
    runs-on: ubuntu-latest
    needs: [auth-service-ci, ai-search-service-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
